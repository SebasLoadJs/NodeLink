name: Isolated integration validation
on:
  push:
    branches: [review/integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'SebasLoadJs/NodeLink' && github.ref == 'refs/heads/review/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Combine exact reviewed commits in runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NodeLink integration validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for entry in \
            '265 58118e7789773fdd9bfe5d68f2f804a9b0e009ee' \
            '266 eefee9449143e77822ed636cbc3144140996d44d' \
            '267 bcc24dbb6019d6af760332ca9959cae46f53f0ab' \
            '268 2ecc4abb8151f163acfd49891bda633222f9be27' \
            '269 d1d6d8fcd97701b2c2c41dd0956bca52ad08ed16' \
            '270 f28706f13eb13014ec15a674385014631503513c'; do
            read -r pr sha <<< "$entry"
            echo "Integrating PR #$pr at $sha"
            git cat-file -e "$sha^{commit}" || git fetch origin "$sha"
            if ! git merge --no-ff --no-commit "$sha"; then
              # Only generated files and review-only documentation/CI can be
              # resolved mechanically. Source conflicts must be reviewed.
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              for file in "${conflicts[@]}"; do
                case "$file" in
                  dist/*|README.md|.github/workflows/fork-review-validation.yml)
                    git checkout --ours -- "$file" && git add -- "$file" || git rm -f -- "$file"
                    ;;
                esac
              done
              python3 .github/review-tools/resolve-observer-conflicts.py "$pr"
              if test -n "$(git diff --name-only --diff-filter=U)"; then
                echo "::error::Unresolved source conflicts while integrating PR #$pr"
                git diff --name-only --diff-filter=U
                git diff --cc -- src config.default.ts
                exit 1
              fi
            fi
            git rm -f --ignore-unmatch .github/workflows/fork-review-validation.yml .github/workflows/automix-regression.yml
            git commit --no-edit
          done
          git log -7 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run type-check
      - run: npm run build
      - name: Node 24 regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(find src -name '*.test.ts' -print0)
          node --experimental-strip-types --test "${tests[@]}"
      - name: Bun regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(find src -name '*.test.ts' ! -path 'src/server/clientIsolation.test.ts' -print0)
          bun test --timeout 30000 "${tests[@]}"
      - name: Synthetic audio observer performance
        run: node --experimental-strip-types .github/review-tools/observer-benchmark.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node 22 regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(find src -name '*.test.ts' -print0)
          node --experimental-strip-types --test "${tests[@]}"
      - name: Save integrated source and compiled output
        run: |
          git diff --stat
          git archive --format=tar.gz -o /tmp/integrated-source.tar.gz HEAD
          tar -czf /tmp/integrated-dist.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-source-and-dist
          path: |
            /tmp/integrated-source.tar.gz
            /tmp/integrated-dist.tar.gz
          retention-days: 7
